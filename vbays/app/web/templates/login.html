{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ settings.app_name }}</h1>
  <p class="muted">{{ settings.company_name }}: staff login</p>
  <form method="post" action="/login">{{ csrf_input }}
    <label>Email or phone <input name="login" required autofocus autocomplete="username"></label>
    <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
    <button>Log in</button>
  </form>
</div>
{% endblock %}
